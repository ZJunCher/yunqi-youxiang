server:
  port: 8081
spring:
  application:
    name: yunqi-youxiang
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/yunqi_youxiang?useSSL=false&serverTimezone=UTC
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:your_mysql_password}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: 6379
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: yqyx-seckill-order-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual
yqyx:
  kafka:
    seckill-order-topic: yqyx.seckill.order
    cache-delete-topic: yqyx.cache.delete
  upload:
    image-dir: ${IMAGE_UPLOAD_DIR:/tmp/yqyx/imgs/}
mybatis-plus:
  type-aliases-package: com.yqyx.entity # 别名扫描包
logging:
  level:
    com.yqyx: debug
  pattern:
    dateformat: HH:mm:ss.SSS
